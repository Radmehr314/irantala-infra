map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker DNS; resolving per request lets the gateway start even while a service is down.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 120s;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Landings (Astro) own every path that is not a backend service.
    location / {
        set $upstream http://landings:4321;
        proxy_pass $upstream;
    }

    location = /iam { return 301 /iam/swagger; }
    location /iam/ {
        set $upstream http://iam:8080;
        proxy_pass $upstream;
    }

    location = /userprofile { return 301 /userprofile/swagger; }
    location /userprofile/ {
        set $upstream http://profile:8080;
        proxy_pass $upstream;
    }

    location = /notification { return 301 /notification/swagger; }
    location /notification/ {
        set $upstream http://notification:8080;
        proxy_pass $upstream;
    }

    location = /market { return 301 /market/swagger; }
    location /market/ {
        set $upstream http://market:8080;
        proxy_pass $upstream;
    }

    location = /appconfig { return 301 /appconfig/swagger; }
    location /appconfig/ {
        set $upstream http://appconfig:8080;
        proxy_pass $upstream;
    }

    location = /wallet { return 301 /wallet/swagger; }
    location /wallet/ {
        set $upstream http://wallet:8080;
        proxy_pass $upstream;
    }

    location = /vault { return 301 /vault/swagger; }
    location /vault/ {
        set $upstream http://vault:8080;
        proxy_pass $upstream;
    }

    location /shop/ {
        rewrite ^/shop/(.*)$ /$1 break;
        set $upstream http://its-api:8080;
        proxy_pass $upstream;
    }

    location = /workflow { return 301 /workflow/swagger; }
    location /workflow/ {
        set $upstream http://workflow:8080;
        proxy_pass $upstream;
    }
}

# IranTala Shop store (stack in /opt/irantalashop, its own gateway on 8100).
server {
    listen 80;
    server_name irantala.shop;
    client_max_body_size 20m;

    location / {
        set $upstream http://its-gateway:8100;
        proxy_pass $upstream;
    }
}

server {
    listen 80;
    server_name www.irantala.shop;
    return 301 https://irantala.shop$request_uri;
}

server {
    listen 80;
    server_name panel.irantala.shop;
    client_max_body_size 20m;

    location / {
        set $upstream http://its-gateway:8101;
        proxy_pass $upstream;
    }
}

server {
    listen 80;
    server_name mail.irantala.shop;
    return 301 https://$host$request_uri;
}

# PWA (Next.js) on its own port until it gets a domain, so the app needs no basePath.
server {
    listen 3000;
    server_name _;
    client_max_body_size 20m;

    location / {
        set $upstream http://pwa:3000;
        proxy_pass $upstream;
    }
}
