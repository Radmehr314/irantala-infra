map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Docker DNS; resolving per request lets the gateway start even while a service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;

    location = / {
        default_type application/json;
        return 200 '{"services":{"iam":"/iam/swagger","userprofile":"/userprofile/swagger","notification":"/notification/swagger","market":"/market/swagger"}}';
    }

    location = /iam { return 301 /iam/swagger; }
    location /iam/ {
        set $upstream http://iam:8080;
        proxy_pass $upstream;
    }

    location = /userprofile { return 301 /userprofile/swagger; }
    location /userprofile/ {
        set $upstream http://profile:8080;
        proxy_pass $upstream;
    }

    location = /notification { return 301 /notification/swagger; }
    location /notification/ {
        set $upstream http://notification:8080;
        proxy_pass $upstream;
    }

    location = /market { return 301 /market/swagger; }
    location /market/ {
        set $upstream http://market:8080;
        proxy_pass $upstream;
    }
}
