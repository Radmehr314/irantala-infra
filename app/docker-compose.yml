name: irantala-app

# Runs on the server next to the infra stack (/opt/irantala/infra). Values in ${...} come from /opt/irantala/app/.env.
networks:
  irantala:
    external: true

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Staging
  Hosting__TrustedProxies__0: 172.16.0.0/12
  Hosting__Auth__Audience: irantalashop
  Hosting__Auth__RequireHttpsMetadata: "false"
  Mongo__ConnectionString: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?replicaSet=rs0&authSource=admin
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: ${RABBITMQ_USER}
  RabbitMq__Password: ${RABBITMQ_PASSWORD}

x-service: &service
  restart: unless-stopped
  networks: [irantala]

services:
  iam:
    <<: *service
    build: { context: ., args: { APP: IranTalaShop.Iam.Api } }
    image: irantala/iam:latest
    container_name: iam
    environment:
      <<: *common-env
      Hosting__PathBase: /iam
      Iam__Tokens__Issuer: http://${PUBLIC_HOST}/iam
      Iam__Tokens__SigningKeys__0__KeyId: ${IAM_SIGNING_KEY_ID}
      Iam__Tokens__SigningKeys__0__PrivateKeyPath: /run/secrets/iam-signing-key.pem
      Iam__Otp__Secret: ${IAM_OTP_SECRET}
      Iam__Passwords__Pepper: ${IAM_PASSWORD_PEPPER}
      Iam__Bootstrap__SuperAdminPhoneNumbers__0: ${SUPER_ADMIN_PHONE}
    volumes:
      - ./secrets/iam-signing-key.pem:/run/secrets/iam-signing-key.pem:ro

  profile:
    <<: *service
    build: { context: ., args: { APP: IranTalaShop.Profile.Api } }
    image: irantala/profile:latest
    container_name: profile
    environment:
      <<: *common-env
      Hosting__PathBase: /userprofile
      Hosting__Auth__Authority: http://${PUBLIC_HOST}/iam
      Hosting__Auth__MetadataAddress: http://iam:8080/iam/.well-known/openid-configuration

  notification:
    <<: *service
    build: { context: ., args: { APP: IranTalaShop.Notification.Api } }
    image: irantala/notification:latest
    container_name: notification
    environment:
      <<: *common-env
      Hosting__PathBase: /notification
      Hosting__Auth__Authority: http://${PUBLIC_HOST}/iam
      Hosting__Auth__MetadataAddress: http://iam:8080/iam/.well-known/openid-configuration
      Sms__Provider: Mediana
      Sms__Mediana__ApiKey: ${MEDIANA_API_KEY}
      Sms__Mediana__SenderNumber: ${MEDIANA_SENDER_NUMBER}
      Sms__Mediana__OtpPatternCode: ${MEDIANA_OTP_PATTERN}

  market:
    <<: *service
    build: { context: ., args: { APP: IranTalaShop.Market.Api } }
    image: irantala/market:latest
    container_name: market
    environment:
      <<: *common-env
      Hosting__PathBase: /market
      Hosting__Auth__Authority: http://${PUBLIC_HOST}/iam
      Hosting__Auth__MetadataAddress: http://iam:8080/iam/.well-known/openid-configuration
      Market__Feed__Simulated__Enabled: ${MARKET_SIMULATED:-false}
      Market__Feed__Tgnsrv__Enabled: ${MARKET_TGNSRV_ENABLED:-false}
      Market__Feed__Tgnsrv__Url: ${MARKET_TGNSRV_URL:-}
      Market__Feed__Streamdata__Enabled: ${MARKET_STREAMDATA_ENABLED:-false}
      Market__Feed__Streamdata__Url: ${MARKET_STREAMDATA_URL:-}

  # Frontends: images are built by each repo's pipeline (irantala-pwa, irantala-landings), never pulled.
  # Runtime settings go in /opt/irantala/frontend/<name>.env, which the pipeline also uses at build time.
  pwa:
    <<: *service
    image: irantala/pwa:latest
    pull_policy: never
    container_name: pwa
    env_file:
      - path: /opt/irantala/frontend/pwa.env
        required: false

  landings:
    <<: *service
    image: irantala/landings:latest
    pull_policy: never
    container_name: landings
    env_file:
      - path: /opt/irantala/frontend/landings.env
        required: false

  gateway:
    <<: *service
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
      - "3000:3000"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [iam, profile, notification, market]
