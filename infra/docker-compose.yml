name: irantala-infra

# Lives at /opt/irantala/infra on the server. Secrets come from /opt/irantala/infra/.env (see .env.example).
# Development phase: ports are open to the internet. For production bind them to 127.0.0.1, e.g. "127.0.0.1:27017:27017".
networks:
  irantala:
    name: irantala

volumes:
  mongo-data:
  rabbitmq-data:
  redis-data:
  bagetter-data:

services:
  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/keyfile", "--wiredTigerCacheSizeGB", "4"]
    environment:
      # Kernel 6.19+ breaks tcmalloc's per-CPU cache (SERVER-121912); remove once MongoDB 8.0.35+ is in use.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo-keyfile:/etc/mongo/keyfile:ro
    ports:
      - "27017:27017"
    networks: [irantala]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks: [irantala]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks: [irantala]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # NuGet feed for the IranTalaShop packages; also mirrors nuget.org so one source serves everything.
  bagetter:
    image: bagetter/bagetter:1.6.5
    container_name: bagetter
    restart: unless-stopped
    environment:
      ApiKey: ${NUGET_API_KEY}
      Storage__Type: FileSystem
      Storage__Path: /data/packages
      Database__Type: Sqlite
      Database__ConnectionString: Data Source=/data/bagetter.db
      Search__Type: Database
      Mirror__Enabled: "true"
      Mirror__PackageSource: https://api.nuget.org/v3/index.json
    volumes:
      - bagetter-data:/data
    ports:
      - "5555:8080"
    networks: [irantala]

  # Development only: lets services running on a developer's machine (foreign IP) reach Mediana through this server.
  sms-relay:
    image: nginx:alpine
    container_name: sms-relay
    restart: unless-stopped
    volumes:
      - ./sms-relay/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    networks: [irantala]
