server {
    listen 80;
    location /sms/ {
        proxy_pass https://api.mediana.ir;
        proxy_set_header Host api.mediana.ir;
        proxy_ssl_server_name on;
        proxy_ssl_name api.mediana.ir;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
